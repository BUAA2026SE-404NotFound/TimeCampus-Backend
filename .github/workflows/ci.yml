name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build And Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven Test
        run: mvn -B clean test

      - name: Package Server Module
        run: mvn -B -pl timetrack-server -am package -DskipTests

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: timetrack-server-jar
          path: timetrack-server/target/*.jar
          if-no-files-found: error

