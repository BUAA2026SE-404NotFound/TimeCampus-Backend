name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run third-party smoke tests with repository secrets"
        required: false
        default: false
        type: boolean
      deploy:
        description: "Build and deploy the tested commit on the production host"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Test And Package (Java 21)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven Test
        run: mvn -B clean test

      - name: Package Server Module
        run: mvn -B -pl timecampus-server -am package -DskipTests

  deploy-dev:
    name: Build And Deploy Backend On Server
    needs: backend
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
    env:
      SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
      SERVER_USERNAME: ${{ secrets.DEPLOY_USERNAME || secrets.DEPLOY_USER }}
      SERVER_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}

    steps:
      - name: Pull, build and activate release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USERNAME }}
          password: ${{ env.SERVER_PASSWORD }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            REPO="$HOME/TimeCampus-Backend"
            URL="https://github.com/${{ github.repository }}.git"
            if [ ! -d "$REPO/.git" ]; then
              git clone "$URL" "$REPO"
            fi
            test -z "$(git -C "$REPO" status --porcelain --untracked-files=no)"
            git -C "$REPO" fetch "$URL" "${{ github.sha }}"
            git -C "$REPO" checkout --detach "${{ github.sha }}"
            cd "$REPO"
            mvn -B -pl timecampus-server -am clean package -DskipTests
            chmod +x deploy/scripts/deploy-backend-artifact.sh
            deploy/scripts/deploy-backend-artifact.sh \
              timecampus-server/target/timecampus-server-*.jar

  third-party-smoke:
    name: Third Party Smoke Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_smoke }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Tencent Map Smoke Test
        env:
          RUN_TENCENT_SMOKE: "true"
          TENCENT_MAP_KEY: ${{ secrets.TENCENT_MAP_KEY }}
          TENCENT_MAP_SK: ${{ secrets.TENCENT_MAP_SK }}
        run: mvn -B -pl timecampus-server -am "-Dtest=com.notfound.timecampusserver.smoke.TencentMapSmokeTest" "-Dsurefire.failIfNoSpecifiedTests=false" test

      - name: Run WeChat Smoke Test
        env:
          RUN_WECHAT_SMOKE: "true"
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
        run: mvn -B -pl timecampus-server -am "-Dtest=com.notfound.timecampusserver.smoke.WechatAuthSmokeTest" "-Dsurefire.failIfNoSpecifiedTests=false" test
