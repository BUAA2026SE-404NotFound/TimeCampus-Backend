name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run third-party smoke tests with repository secrets"
        required: false
        default: false
        type: boolean
      deploy:
        description: "Deploy the tested jar to the production host"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Test And Package (Java 21)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven Test
        run: mvn -B clean test

      - name: Package Server Module
        run: mvn -B -pl timecampus-server -am package -DskipTests

      - name: Prepare release artifact
        run: |
          mkdir release
          cp timecampus-server/target/timecampus-server-*.jar release/timecampus-server.jar
          cp deploy/scripts/deploy-backend-artifact.sh release/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: timecampus-backend-${{ github.sha }}
          path: release/
          if-no-files-found: error

  deploy-dev:
    name: Deploy Backend Artifact
    needs: backend
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
    env:
      SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
      SERVER_USERNAME: ${{ secrets.DEPLOY_USERNAME || secrets.DEPLOY_USER }}
      SERVER_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: timecampus-backend-${{ github.sha }}
          path: release

      - name: Upload release
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USERNAME }}
          password: ${{ env.SERVER_PASSWORD }}
          source: "release/*"
          target: "/home/${{ env.SERVER_USERNAME }}/backend-incoming/${{ github.sha }}"
          strip_components: 1

      - name: Activate release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USERNAME }}
          password: ${{ env.SERVER_PASSWORD }}
          script: |
            set -euo pipefail
            INCOMING="$HOME/backend-incoming/${{ github.sha }}"
            chmod +x "$INCOMING/deploy-backend-artifact.sh"
            "$INCOMING/deploy-backend-artifact.sh" "$INCOMING/timecampus-server.jar"

  third-party-smoke:
    name: Third Party Smoke Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_smoke }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Tencent Map Smoke Test
        env:
          RUN_TENCENT_SMOKE: "true"
          TENCENT_MAP_KEY: ${{ secrets.TENCENT_MAP_KEY }}
          TENCENT_MAP_SK: ${{ secrets.TENCENT_MAP_SK }}
        run: mvn -B -pl timecampus-server -am "-Dtest=com.notfound.timecampusserver.smoke.TencentMapSmokeTest" "-Dsurefire.failIfNoSpecifiedTests=false" test

      - name: Run WeChat Smoke Test
        env:
          RUN_WECHAT_SMOKE: "true"
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
        run: mvn -B -pl timecampus-server -am "-Dtest=com.notfound.timecampusserver.smoke.WechatAuthSmokeTest" "-Dsurefire.failIfNoSpecifiedTests=false" test
