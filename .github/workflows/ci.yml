name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run third-party smoke tests with repository secrets"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Test And Package (Java 21)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven Test
        run: mvn -B clean test

      - name: Package Server Module
        run: mvn -B -pl timecampus-server -am package -DskipTests

  deploy-dev:
    name: Deploy Backend On Dev Merge
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev' }}
    env:
      SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
      SERVER_USERNAME: ${{ secrets.DEPLOY_USERNAME || secrets.DEPLOY_USER }}
      SERVER_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      DEPLOY_BRANCH: dev

    steps:
      - name: Deploy on cloud server
        if: ${{ env.SERVER_HOST != '' && env.SERVER_USERNAME != '' && env.SERVER_PASSWORD != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USERNAME }}
          password: ${{ env.SERVER_PASSWORD }}
          script: |
            set -e

            if [ -e "$HOME/TimeCampus/TimeCampus-Backend/.git" ]; then
              REPO_DIR="$HOME/TimeCampus/TimeCampus-Backend"
            elif [ -e "$HOME/TimeCampus-Backend/.git" ]; then
              REPO_DIR="$HOME/TimeCampus-Backend"
            else
              echo "Backend repository not found on server"
              exit 1
            fi

            cd "$REPO_DIR"
            git fetch origin
            git checkout -B "${{ env.DEPLOY_BRANCH }}" "origin/${{ env.DEPLOY_BRANCH }}"
            chmod +x deploy/scripts/deploy-backend.sh

            DEPLOY_BRANCH="${{ env.DEPLOY_BRANCH }}" \
            REPO_DIR="$REPO_DIR" \
            APP_DIR="$HOME/app" \
            SERVICE_NAME="timecampus-backend" \
            HEALTH_URL="http://127.0.0.1:8080/api/v1/health" \
              bash deploy/scripts/deploy-backend.sh

  third-party-smoke:
    name: Third Party Smoke Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_smoke }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Tencent Map Smoke Test
        env:
          RUN_TENCENT_SMOKE: "true"
          TENCENT_MAP_KEY: ${{ secrets.TENCENT_MAP_KEY }}
          TENCENT_MAP_SK: ${{ secrets.TENCENT_MAP_SK }}
        run: mvn -B -pl timecampus-server -am "-Dtest=com.notfound.timecampusserver.smoke.TencentMapSmokeTest" "-Dsurefire.failIfNoSpecifiedTests=false" test

      - name: Run WeChat Smoke Test
        env:
          RUN_WECHAT_SMOKE: "true"
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
        run: mvn -B -pl timecampus-server -am "-Dtest=com.notfound.timecampusserver.smoke.WechatAuthSmokeTest" "-Dsurefire.failIfNoSpecifiedTests=false" test
