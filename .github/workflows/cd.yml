name: cd

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'release' }}
    name: Build And Deploy On Tencent Cloud
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
      SERVER_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
      SERVER_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      DEPLOY_BRANCH: main

    steps:
      - name: Deploy on cloud server
        if: ${{ env.SERVER_HOST != '' && env.SERVER_USERNAME != '' && env.SERVER_PASSWORD != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USERNAME }}
          password: ${{ env.SERVER_PASSWORD }}
          script: |
            set -e
            REPO_DIR=~/TimeTrack-Backend
            APP_DIR=~/TimeTrack-Backend/app
            BRANCH="${{ env.DEPLOY_BRANCH }}"

            if [ ! -d "$REPO_DIR/.git" ]; then
              EXISTING_APP_BACKUP=""
              if [ -d "$APP_DIR" ]; then
                EXISTING_APP_BACKUP=$(mktemp -d)
                mv "$APP_DIR" "$EXISTING_APP_BACKUP/app"
              fi
              rm -rf "$REPO_DIR"
              git clone "git@github.com:${{ github.repository }}.git" "$REPO_DIR"
              if [ -n "$EXISTING_APP_BACKUP" ]; then
                mkdir -p "$REPO_DIR"
                mv "$EXISTING_APP_BACKUP/app" "$APP_DIR"
                rmdir "$EXISTING_APP_BACKUP"
              fi
            fi

            mkdir -p "$APP_DIR"

            cd "$REPO_DIR"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"

            mvn -B -pl timetrack-server -am package -DskipTests

            cd timetrack-ui
            npm ci
            npm run build
            cd ..

            APP_JAR=$(find timetrack-server/target -maxdepth 1 -name "*.jar" ! -name "*original*" | head -n 1)
            if [ -z "$APP_JAR" ]; then
              echo "No runnable jar file found in timetrack-server/target"
              ls -lah timetrack-server/target || true
              exit 1
            fi

            cp "$APP_JAR" "$APP_DIR/app.jar"
            rm -rf "$APP_DIR/ui"
            mkdir -p "$APP_DIR/ui"
            cp -R timetrack-ui/dist/. "$APP_DIR/ui/"

            cd "$APP_DIR"

            if [ ! -f config/application-prod.yaml ]; then
              echo "Missing $APP_DIR/config/application-prod.yaml"
              echo "Create it from timetrack-server/src/main/resources/application-prod-example.yaml before deployment."
              exit 1
            fi

            if [ -f app.pid ] && kill -0 "$(cat app.pid)" 2>/dev/null; then
              kill "$(cat app.pid)" || true
              sleep 2
            fi

            nohup java -jar app.jar --spring.profiles.active=prod > app.log 2>&1 &
            echo $! > app.pid
            sleep 8
            ps -p "$(cat app.pid)" -o comm= || (echo "Failed to start application" && tail -n 200 app.log && exit 1)
            echo "Deployment successful"
