name: cd

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'release'
    name: Build Package (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Server Jar
        run: mvn -B -pl timetrack-server -am package -DskipTests

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: timetrack-server-jar
          path: timetrack-server/target/*.jar
          if-no-files-found: error

  deploy:
    name: Deploy To Cloud Server
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USERNAME != '' && secrets.DEPLOY_PASSWORD != '' && secrets.DEPLOY_DIR != '' }}

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: timetrack-server-jar
          path: dist

      - name: Copy Jar To Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "dist/*.jar"
          target: ${{ secrets.DEPLOY_DIR }}

      - name: Restart Service On Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            APP_DIR="${{ secrets.DEPLOY_DIR }}"
            APP_JAR=$(find "$APP_DIR" -maxdepth 1 -name "*.jar" | head -n 1)
            if [ -z "$APP_JAR" ]; then
              echo "No jar file found in $APP_DIR"
              exit 1
            fi

            if [ -f "$APP_DIR/app.pid" ] && kill -0 "$(cat "$APP_DIR/app.pid")" 2>/dev/null; then
              kill "$(cat "$APP_DIR/app.pid")" || true
              sleep 2
            fi

            nohup java -jar "$APP_JAR" --spring.profiles.active=prod > "$APP_DIR/app.log" 2>&1 &
            echo $! > "$APP_DIR/app.pid"
            sleep 5
            ps -p "$(cat "$APP_DIR/app.pid")" -f || true

