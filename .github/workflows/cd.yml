name: cd

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'release'
    name: Build Package (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Server Jar
        run: mvn -B -pl timetrack-server -am package -DskipTests

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: timetrack-server-jar
          path: timetrack-server/target/*.jar
          if-no-files-found: error

  deploy:
    name: Deploy To Cloud Server
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USERNAME != '' && secrets.DEPLOY_PASSWORD != ''}}
    env:
      SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
      SERVER_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
      SERVER_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}

    steps:
      - name: Deploy to Cloud Server
        if: ${{ env.SERVER_HOST != '' && env.SERVER_USERNAME != '' && env.SERVER_PASSWORD != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USERNAME }}
          password: ${{ env.SERVER_PASSWORD }}
          script: |
            set -e
            REPO_DIR=~/TimeTrack-Backend
            APP_DIR=~/TimeTrack-Backend/app
            mkdir -p "$APP_DIR"
            if [ ! -d "$REPO_DIR" ]; then
              git clone "git@github.com:${{ github.repository }}.git" "$REPO_DIR"
            fi
            
            cd "$REPO_DIR"
            
            git pull origin main
            
            mvn -B -pl timetrack-server -am package -DskipTests
            
            APP_JAR=$(find timetrack-server/target -maxdepth 1 -name "*.jar" | head -n 1) 
            if [ -z "$APP_JAR" ]; then
              echo "No jar file found in timetrack-server/target"
              ls -lah target || true
              exit 1
            fi
            
            cp "$APP_JAR" "$APP_DIR/app.jar"
            cd "$APP_JAR"
            
            if [ -f app.pid ] && kill -0 "$(cat app.pid)" 2>/dev/null; then
              kill "$(cat app.pid)" || true
              sleep 2
            fi
            
            nohup java -jar app.jar --spring.profiles.active=prod > app.log 2>&1 &
            echo $! > app.pid
            sleep 5
            ps -p "$(cat app.pid)" -o comm= || (echo "Failed to start application" && exit 1)
            echo "Deployment successful"