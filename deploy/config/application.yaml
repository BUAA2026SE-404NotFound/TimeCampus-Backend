spring:
  application:
    name: timecampus-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

storage:
  local-root-dir: ${TIMECAMPUS_STORAGE_DIR:/data/storage}
  max-file-size-mb: ${TIMECAMPUS_MAX_FILE_SIZE_MB:10}
  media-file-token-ttl-seconds: ${TIMECAMPUS_MEDIA_FILE_TOKEN_TTL_SECONDS:600}

tencent-map:
  key: ${TENCENT_MAP_KEY:}
  sk: ${TENCENT_MAP_SK:}
  geocoder-url: https://apis.map.qq.com/ws/geocoder/v1/
  place-search-url: https://apis.map.qq.com/ws/place/v1/search

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [requestId=%X{requestId}] - %msg%n"
