  /api/v1/map/home:
    get:
      summary: "地图首页聚合"
      description: "地图首页聚合"
      parameters:
      - name: "year"
        in: "query"
        description: "目标年份（可选，用于选择最接近年份的封面图）"
        required: false
        schema:
          type: "integer"
          nullable: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "object"
                    properties:
                      pois:
                        type: "array"
                        description: "地点列表（用于地图打点）"
                        items:
                          type: "object"
                          properties:
                            id:
                              type: "integer"
                              description: "地点 ID（poi.id）"
                              format: "int64"
                              example: 1
                            name:
                              type: "string"
                              description: "地点名称"
                              example: "主楼"
                            latitude:
                              type: "number"
                              description: "纬度"
                              example: "39.90420000"
                            longitude:
                              type: "number"
                              description: "经度"
                              example: "116.40740000"
                            status:
                              type: "integer"
                              description: "上架状态：1 上架，0 下架"
                              example: 1
                            description:
                              type: "string"
                              description: "地点简介（可选）"
                              example: "北航标志性建筑之一。"
                            coverImagePath:
                              type: "string"
                              description: "封面图片路径（根据 year 选择最接近年份的官方已通过影像）"
                              example: "https://example.com/images/poi-1-2000.jpg"
                            availableYears:
                              type: "array"
                              description: "该地点可用年份列表（官方已通过影像的年份集合）"
                              example: "[1952, 1980, 2000]"
                              items:
                                type: "integer"
                            mediaList:
                              type: "array"
                              description: "该地点关联的历史影像列表（用于地点信息卡片展示）"
                              items:
                                type: "object"
                                properties:
                                  id:
                                    type: "integer"
                                    description: "影像 ID（media.id）"
                                    format: "int64"
                                    example: 1
                                  year:
                                    type: "integer"
                                    description: "拍摄年份（media.year）"
                                    example: 2000
                                  imagePath:
                                    type: "string"
                                    description: "图片路径（media.image_path）"
                                    example: "https://example.com/images/poi-1-2000.jpg"
                                  description:
                                    type: "string"
                                    description: "影像说明（media.description）"
                                    example: "主楼 2000 年旧照"
                                  type:
                                    type: "string"
                                    description: "类型：official/ugc（media.type）"
                                    example: "official"
                                description: "com.notfound.timetrackpojo.vo.MapMediaVO"
                          description: "com.notfound.timetrackpojo.vo.MapPoiVO"
                    description: ""
