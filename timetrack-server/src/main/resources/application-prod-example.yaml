spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: info
    com.notfound: info

wechat:
  appid: ${WECHAT_APPID}
  secret: ${WECHAT_SECRET}

tencent-map:
  key: ${TENCENT_MAP_KEY}
  sk: ${TENCENT_MAP_SK}
