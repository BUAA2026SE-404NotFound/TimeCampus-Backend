spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

server:
  port: ${SERVER_PORT:8080}

storage:
  local-root-dir: ${TIMECAMPUS_STORAGE_DIR:/home/ubuntu/cos}
  max-file-size-mb: ${TIMECAMPUS_MAX_FILE_SIZE_MB:10}
  media-file-token-ttl-seconds: ${TIMECAMPUS_MEDIA_FILE_TOKEN_TTL_SECONDS:600}

cap:
  enabled: ${CAP_ENABLED:true}
  siteverify-url: ${CAP_SITEVERIFY_URL}
  secret: ${CAP_SECRET}
  connect-timeout: ${CAP_CONNECT_TIMEOUT:2s}
  read-timeout: ${CAP_READ_TIMEOUT:5s}

logging:
  level:
    root: info
    com.notfound: info

wechat:
  appid: ${WECHAT_APPID}
  secret: ${WECHAT_SECRET}

tencent-map:
  key: ${TENCENT_MAP_KEY}
  sk: ${TENCENT_MAP_SK}
