spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/timecampus?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

logging:
  level:
    root: info
    com.notfound: debug

wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}

storage:
  local-root-dir: ${TIMECAMPUS_STORAGE_DIR:/home/ubuntu/cos}
  max-file-size-mb: ${TIMECAMPUS_MAX_FILE_SIZE_MB:20}
  media-file-token-ttl-seconds: ${TIMECAMPUS_MEDIA_FILE_TOKEN_TTL_SECONDS:600}

cap:
  enabled: ${CAP_ENABLED:false}
  siteverify-url: ${CAP_SITEVERIFY_URL:}
  secret: ${CAP_SECRET:}
  connect-timeout: ${CAP_CONNECT_TIMEOUT:2s}
  read-timeout: ${CAP_READ_TIMEOUT:5s}

tencent-map:
  key: ${TENCENT_MAP_KEY:}
  sk: ${TENCENT_MAP_SK:}
