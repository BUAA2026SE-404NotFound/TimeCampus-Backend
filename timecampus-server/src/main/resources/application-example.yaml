spring:
  application:
    name: timecampus-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  ai:
    mcp:
      server:
        enabled: ${TIMECAMPUS_MCP_ENABLED:false}
        protocol: STREAMABLE
        name: timecampus-admin-mcp
        version: ${TIMECAMPUS_MCP_VERSION:1.0.0-SNAPSHOT}
        type: SYNC
        instructions: "TimeCampus admin MCP server for POI, media, review and copy maintenance. Use read tools/resources before destructive writes."
        streamable-http:
          mcp-endpoint: ${TIMECAMPUS_MCP_ENDPOINT:/mcp}
          disallow-delete: true
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_GRPC_PORT:6334}
        api-key: ${QDRANT_API_KEY:}
        collection-name: ${QDRANT_COLLECTION:timecampus_rag}
        use-tls: ${QDRANT_USE_TLS:false}
        initialize-schema: ${QDRANT_INITIALIZE_SCHEMA:true}

server:
  port: ${SERVER_PORT:8080}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

storage:
  local-root-dir: ${TIMECAMPUS_STORAGE_DIR:/home/ubuntu/cos}
  max-file-size-mb: ${TIMECAMPUS_MAX_FILE_SIZE_MB:20}
  media-file-token-ttl-seconds: ${TIMECAMPUS_MEDIA_FILE_TOKEN_TTL_SECONDS:600}

cap:
  enabled: ${CAP_ENABLED:false}
  siteverify-url: ${CAP_SITEVERIFY_URL:}
  secret: ${CAP_SECRET:}
  connect-timeout: ${CAP_CONNECT_TIMEOUT:2s}
  read-timeout: ${CAP_READ_TIMEOUT:5s}

tencent-map:
  key: ${TENCENT_MAP_KEY:}
  sk: ${TENCENT_MAP_SK:}
  geocoder-url: https://apis.map.qq.com/ws/geocoder/v1/
  place-search-url: https://apis.map.qq.com/ws/place/v1/search
  walking-route-url: https://apis.map.qq.com/ws/direction/v1/walking/

timecampus:
  ai:
    deepseek:
      chat:
        enabled: ${DEEPSEEK_CHAT_ENABLED:false}
        api-key: ${DEEPSEEK_API_KEY:}
        endpoint: ${DEEPSEEK_CHAT_ENDPOINT:https://api.deepseek.com/v1/chat/completions}
        model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}
        temperature: ${DEEPSEEK_CHAT_TEMPERATURE:0.2}
        max-tokens: ${DEEPSEEK_CHAT_MAX_TOKENS:1200}
    zhipu:
      embedding:
        enabled: ${ZHIPU_EMBEDDING_ENABLED:false}
        api-key: ${ZHIPU_API_KEY:}
        endpoint: ${ZHIPU_EMBEDDING_ENDPOINT:https://open.bigmodel.cn/api/paas/v4/embeddings}
        model: ${ZHIPU_EMBEDDING_MODEL:embedding-3}
        dimensions: ${ZHIPU_EMBEDDING_DIMENSIONS:768}
        batch-size: ${ZHIPU_EMBEDDING_BATCH_SIZE:64}
  mcp:
    endpoint: ${TIMECAMPUS_MCP_ENDPOINT:/mcp}
    auth-required: ${TIMECAMPUS_MCP_AUTH_REQUIRED:true}
    token-header: ${TIMECAMPUS_MCP_TOKEN_HEADER:X-TimeCampus-MCP-Token}
    token: ${TIMECAMPUS_MCP_TOKEN:}
    admin-id: ${TIMECAMPUS_MCP_ADMIN_ID:1}
    admin-role: ${TIMECAMPUS_MCP_ADMIN_ROLE:admin}
  rag:
    vector-enabled: ${TIMECAMPUS_RAG_VECTOR_ENABLED:true}
    lexical-fallback-enabled: ${TIMECAMPUS_RAG_LEXICAL_FALLBACK_ENABLED:true}
    default-top-k: ${TIMECAMPUS_RAG_DEFAULT_TOP_K:8}
    max-top-k: ${TIMECAMPUS_RAG_MAX_TOP_K:20}
    similarity-threshold: ${TIMECAMPUS_RAG_SIMILARITY_THRESHOLD:0.0}
    chunk-max-chars: ${TIMECAMPUS_RAG_CHUNK_MAX_CHARS:1200}
    chunk-overlap-chars: ${TIMECAMPUS_RAG_CHUNK_OVERLAP_CHARS:120}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [requestId=%X{requestId}] - %msg%n"
