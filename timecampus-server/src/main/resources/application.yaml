spring:
  application:
    name: timecampus-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    disable-swagger-default-url: true

storage:
  local-root-dir: ${TIMECAMPUS_STORAGE_DIR:/home/ubuntu/cos}
  max-file-size-mb: 10

tencent-map:
  key: ${TENCENT_MAP_KEY:}
  sk: ${TENCENT_MAP_SK:}
  geocoder-url: https://apis.map.qq.com/ws/geocoder/v1/
  place-search-url: https://apis.map.qq.com/ws/place/v1/search

logging:
  pattern:
    # requestId is injected by RequestIdFilter for traceability across logs.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [requestId=%X{requestId}] - %msg%n"
